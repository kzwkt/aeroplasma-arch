name: Arch Linux CI

on:
  workflow_dispatch:
  push:
    paths:
      - 'build.sh'
  pull_request:
    paths:
      - 'build.sh'

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pacman -Sy --noconfirm base-devel git sudo

      - name: Prepare build user
        run: |
          useradd -m build
          chown -R build:build .

      - name: Run build script
        run: |
          chmod +x build.sh
          su build -c './build.sh'

      - name: Collect built packages
        run: |
          echo "FILES=$(ls output/*.pkg.tar.* | tr '\n' ' ')" >> $GITHUB_ENV

      - name: Create/Update GitHub Release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          files: ${{ env.FILES }}
          replace: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
